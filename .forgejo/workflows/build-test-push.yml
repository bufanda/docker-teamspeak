---
name: Build action
enable-email-notifications: true
on:
  push:

jobs:
  build:
    name: Build bundle
    runs-on: docker
    steps:
      - uses: actions/checkout@v6
      - name: Set image tag
        id: image_tag
        run:  echo "tag=$(date +%Y%m%d)" >> $FORGEJO_OUTPUT
      - name: Build image
        run: docker build -t registry.nbg.bufanda.de/bufanda/teamspeak:latest alpine
